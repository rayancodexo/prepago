name: Publish site

# The site is the dist/ folder. GitHub Pages serves the gh-pages branch,
# so every change to dist/ on main is copied there.
on:
  push:
    branches: [main]
    paths: ['dist/**', '.github/workflows/publish.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy dist/ to the gh-pages branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse --short HEAD)
          out=$(mktemp -d)
          cp -a dist/. "$out/"
          cd "$out"
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish dist/ from main ($sha)"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
